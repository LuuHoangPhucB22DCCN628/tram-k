<div class="member-shell">
  <a class="skip-link" href="#member-main-content">Bỏ qua đến nội dung chính</a>

  <app-public-header></app-public-header>

  <div class="member-shell__body">
    <aside class="member-shell__sidebar" [class.member-shell__sidebar--open]="isSidebarOpen()">
      <button
        class="member-shell__sidebar-toggle"
        type="button"
        aria-controls="member-navigation"
        [attr.aria-expanded]="isSidebarOpen()"
        (click)="toggleSidebar()"
      >
        <span>Menu tài khoản</span>
        <span class="member-shell__sidebar-chevron" aria-hidden="true"></span>
      </button>

      <nav id="member-navigation" aria-label="Điều hướng thành viên">
        @for (item of menuItems(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="member-shell__nav-link--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            ariaCurrentWhenActive="page"
            class="member-shell__nav-link"
            (click)="closeSidebar()"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </aside>

    <main id="member-main-content" class="member-shell__main ui-route-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <app-public-footer></app-public-footer>
</div>
