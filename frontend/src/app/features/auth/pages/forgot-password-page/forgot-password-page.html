<section class="auth-page" aria-labelledby="forgot-title">
  <div class="auth-page__card">
    <p class="auth-page__eyebrow">Khôi phục tài khoản</p>
    <h1 id="forgot-title">Quên mật khẩu</h1>
    <p class="auth-page__intro">Nhập email đã đăng ký để nhận hướng dẫn tạo mật khẩu mới.</p>

    <form class="auth-form" [formGroup]="forgotForm" (ngSubmit)="submit()" novalidate>
      <div class="auth-form__field">
        <label for="forgot-email">Email</label>
        <input
          id="forgot-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="ban@example.com"
          [attr.aria-invalid]="forgotForm.controls.email.invalid && submitted() ? true : null"
          [attr.aria-describedby]="forgotForm.controls.email.invalid ? 'forgot-email-error' : null"
        />
        @if (hasError('required')) {
          <p id="forgot-email-error" class="auth-form__error">Vui lòng nhập email.</p>
        } @else if (hasError('email')) {
          <p id="forgot-email-error" class="auth-form__error">Email chưa đúng định dạng.</p>
        }
      </div>

      @if (feedback(); as result) {
        <p class="auth-form__alert auth-form__alert--success" role="status">
          {{ result.message }}
        </p>
      }

      <app-ui-button type="submit">Gửi hướng dẫn</app-ui-button>
    </form>

    <p class="auth-page__footer"><a routerLink="/dang-nhap">Quay lại đăng nhập</a></p>
  </div>
</section>
