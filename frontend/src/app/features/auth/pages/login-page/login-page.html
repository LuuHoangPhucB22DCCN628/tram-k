<section class="auth-page" aria-labelledby="login-title">
  <div class="auth-page__card">
    <p class="auth-page__eyebrow">Tài khoản Trạm K</p>
    <h1 id="login-title">Đăng nhập</h1>
    <p class="auth-page__intro">Tiếp tục chia sẻ, đồng hành và theo dõi các đăng ký hỗ trợ.</p>

    <app-login-form
      [isSubmitting]="isSubmitting()"
      [feedback]="feedback()"
      (credentialsSubmitted)="login($event)"
    />

    <p class="auth-page__footer">Chưa có tài khoản? <a routerLink="/dang-ky">Đăng ký</a></p>
  </div>
</section>
