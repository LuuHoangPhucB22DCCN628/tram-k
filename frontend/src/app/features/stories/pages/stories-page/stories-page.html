<article class="stories-page">
  <app-destiny-story-hero [showCta]="true" appReveal="scale" />

  <app-kitchen-story-hero />

  <section id="story-list" class="story-list" aria-label="Những câu chuyện truyền cảm hứng khác">
    @for (story of stories(); track story.title; let index = $index) {
      <article class="story-card" appReveal="up" [revealDelay]="(index % 2) * 90" data-ui-card>
        <img [src]="story.image" [alt]="story.title" />
        <div class="story-card__body">
          <h2>{{ story.title }}</h2>
          <p>{{ story.description }}</p>
          <a class="story-card__button" [routerLink]="story.route">
            <span>Xem thêm</span>
            <img src="/assets/images/stories/arrow-primary.svg" alt="" aria-hidden="true" />
          </a>
        </div>
      </article>
    }
  </section>
</article>
