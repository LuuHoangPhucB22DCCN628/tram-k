<header class="sticky top-0 z-50 border-b border-[var(--color-border)] bg-[var(--color-surface)]">
  <!-- Dùng token màu chung thay vì ghi mã màu trực tiếp -->
  <div class="flex items-center justify-between gap-6 px-5 py-4 sm:px-8 xl:px-20 xl:py-6">
    <!-- Figma desktop dùng padding ngang 80px, dọc 24px -->
    <a
      routerLink="/"
      (click)="closeMobileMenu()"
      class="block w-[135px] shrink-0 sm:w-[169px]"
      aria-label="Trạm K - Trang chủ"
    >
      <img
        src="/assets/images/brand/tram-k-logo.svg"
        width="169"
        height="40"
        class="block h-auto w-full"
        alt="Trạm K"
      />
      <!-- Logo SVG xuất trực tiếp từ Figma -->
    </a>

    <nav class="hidden items-center xl:flex" aria-label="Điều hướng chính">
      <!-- Menu desktop đúng thứ tự trong Figma -->
      @for (item of menuItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-[var(--color-brand-soft)] text-[var(--color-brand-primary)]"
          ariaCurrentWhenActive="page"
          class="whitespace-nowrap rounded-lg px-3 py-2 text-center text-[16px] font-medium leading-5 text-[var(--color-text-muted)] transition-colors hover:text-[var(--color-brand-primary)]"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="hidden shrink-0 xl:block">
      <!-- Nút tìm kiếm phía cuối header -->
      <a
        routerLink="/tim-kiem"
        class="grid size-[45px] place-items-center rounded-xl border border-[var(--color-brand-primary)] bg-[var(--color-surface)]"
        aria-label="Tìm kiếm"
      >
        <img
          src="/assets/icons/search.svg"
          width="21"
          height="21"
          class="size-[21px]"
          alt=""
          aria-hidden="true"
        />
        <!-- Icon tìm kiếm xuất trực tiếp từ Figma -->
      </a>
    </div>

    <button
      type="button"
      class="relative size-10 rounded-xl border border-[var(--color-brand-primary)] text-[var(--color-brand-primary)] xl:hidden"
      aria-label="Mở hoặc đóng menu chính"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="isMobileMenuOpen()"
      (click)="toggleMobileMenu()"
    >
      @if (isMobileMenuOpen()) {
        <span
          class="absolute left-1/2 top-1/2 h-0.5 w-5 -translate-x-1/2 -translate-y-1/2 rotate-45 bg-current"
        ></span>
        <!-- Nét thứ nhất của biểu tượng đóng -->
        <span
          class="absolute left-1/2 top-1/2 h-0.5 w-5 -translate-x-1/2 -translate-y-1/2 -rotate-45 bg-current"
        ></span>
        <!-- Nét thứ hai của biểu tượng đóng -->
      } @else {
        <span class="absolute left-1/2 top-[13px] h-0.5 w-5 -translate-x-1/2 bg-current"></span>
        <!-- Thanh trên của biểu tượng menu -->
        <span class="absolute left-1/2 top-[19px] h-0.5 w-5 -translate-x-1/2 bg-current"></span>
        <!-- Thanh giữa của biểu tượng menu -->
        <span class="absolute left-1/2 top-[25px] h-0.5 w-5 -translate-x-1/2 bg-current"></span>
        <!-- Thanh dưới của biểu tượng menu -->
      }
    </button>
  </div>

  @if (isMobileMenuOpen()) {
    <nav
      id="mobile-navigation"
      class="border-t border-[var(--color-border)] bg-[var(--color-surface)] px-5 py-4 xl:hidden"
      aria-label="Điều hướng trên thiết bị di động"
    >
      <div class="mx-auto flex max-w-7xl flex-col gap-1">
        <!-- Danh sách menu mobile -->
        @for (item of menuItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-[var(--color-brand-soft)] text-[var(--color-brand-primary)]"
            ariaCurrentWhenActive="page"
            class="rounded-lg px-3 py-2.5 text-[16px] font-medium leading-5 text-[var(--color-text-muted)]"
            (click)="closeMobileMenu()"
          >
            {{ item.label }}
          </a>
        }

        <a
          routerLink="/tim-kiem"
          class="mt-2 flex items-center gap-2 rounded-xl border border-[var(--color-brand-primary)] px-3 py-2.5 text-[16px] font-medium text-[var(--color-brand-primary)]"
          aria-label="Tìm kiếm"
          (click)="closeMobileMenu()"
        >
          <img
            src="/assets/icons/search.svg"
            width="21"
            height="21"
            class="size-[21px]"
            alt=""
            aria-hidden="true"
          />
          Tìm kiếm
        </a>
      </div>
    </nav>
  }
</header>
